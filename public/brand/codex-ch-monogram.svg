<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Codex Homes CH monogram">
  <title>Codex Homes CH monogram</title>
  <!-- registration crosshair, top-left -->
  <g stroke="#5E8AB4" stroke-width="1.5" fill="none">
    <line x1="20" y1="40" x2="40" y2="40" />
    <line x1="30" y1="30" x2="30" y2="50" />
  </g>
  <!-- registration crosshair, bottom-right -->
  <g stroke="#5E8AB4" stroke-width="1.5" fill="none">
    <line x1="200" y1="200" x2="220" y2="200" />
    <line x1="210" y1="190" x2="210" y2="210" />
  </g>
  <!-- C arc -->
  <path d="M 142 70
           A 60 60 0 1 0 142 170"
        fill="none" stroke="#326295" stroke-width="20" stroke-linecap="square" />
  <!-- H structure -->
  <rect x="118" y="62" width="14" height="120" fill="#101820" />
  <rect x="166" y="62" width="14" height="120" fill="#101820" />
  <rect x="118" y="116" width="62" height="12" fill="#101820" />
  <!-- registration ticks aligning the H -->
  <g stroke="#5E8AB4" stroke-width="1.2">
    <line x1="125" y1="50" x2="125" y2="58" />
    <line x1="173" y1="50" x2="173" y2="58" />
    <line x1="125" y1="186" x2="125" y2="194" />
    <line x1="173" y1="186" x2="173" y2="194" />
  </g>
</svg>
